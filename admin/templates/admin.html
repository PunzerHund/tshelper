{% extends "base.html" %}
{% block content %}
<h1>Админка</h1>
<form method="post" action="{{ url_for('admin.create_user') }}" class="centerbox">
    <div class="headline">Создать пользователя/бота</div>
    <input type="text" name="login" placeholder="Логин" required>
    <input type="password" name="password" placeholder="Пароль" required>
    <input type="text" name="token" placeholder="Telegram TG_TOKEN" required>
    <button type="submit">Создать</button>
</form>

<h3 class="mt-4">Существующие пользователи</h3>
<ul>
{% for login, info in users.items() if info.role == 'user' %}
    <li>{{ login }}</li>
{% endfor %}
</ul>
{% endblock %}
